name: Pages Inspect
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose and seed D1 (no early exits)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          set -x
          ls -la
          echo "=== wrangler.toml full ==="
          cat wrangler.toml
          DB=""
          for TOML in wrangler.toml wrangler.jsonc wrangler.json; do
            if [ -f "$TOML" ]; then
              DB=$(python3 -c "import re; t=open('$TOML').read(); m=re.search(r'database_name\\s*=\\s*[\"\']([^\"\']+)', t); print(m.group(1) if m else '')" 2>/dev/null || echo "")
            fi
            [ -n "$DB" ] && break
          done
          echo "PARSED_DB=$DB"
